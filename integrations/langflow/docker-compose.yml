# Langflow(노코드 외피)를 띄우고, 우리 커스텀 컴포넌트를 마운트한다.
# smb-finder 서비스는 호스트에서 따로 실행하고(예: uvicorn ... --port 8010),
# 컴포넌트의 'smb-finder 주소'를 http://host.docker.internal:8010 으로 둔다.
#
# 보안(CLAUDE.md): 환자/검사 데이터가 외부로 나가지 않도록 Langflow도 사내망에서만 띄운다.
# 외부 LLM 노드를 쓰지 말고, 폴더 검색은 이 컴포넌트(→ 사내 smb-finder)만 사용한다.
# 워크플로우 자동 생성은 기본적으로 규칙/로컬 LLM만 사용하고, OpenAI는 명시 설정 시에만 허용한다.
# 포트는 localhost에만 바인딩한다. 다른 PC 접근은 SSH 터널/사내 접근통제 뒤에서 별도 override로 연다.

services:
  langflow:
    image: langflowai/langflow:latest
    ports:
      - "127.0.0.1:${LANGFLOW_PORT:-7860}:7860"
    environment:
      # 우리 커스텀 컴포넌트를 카테고리 폴더 단위로 로드한다.
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      PYTHONPATH: /app
      # 흐름/세션을 파일 DB에 영속화(사내 디스크). 외부 DB 불필요.
      LANGFLOW_DATABASE_URL: sqlite:////app/langflow_data/langflow.db
      LANGFLOW_CONFIG_DIR: /app/langflow_data
      # 로컬 개발 중 브라우저 세션이 만료되면 flow 페이지가 빈 "Untitled Flow"로 보일 수 있다.
      # localhost 바인딩 전제의 편의 설정이며, 운영/공용 배포에서는 더 짧게 override한다.
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN:-true}
      LANGFLOW_ACCESS_TOKEN_EXPIRE_SECONDS: ${LANGFLOW_ACCESS_TOKEN_EXPIRE_SECONDS:-43200}
      LANGFLOW_REFRESH_TOKEN_EXPIRE_SECONDS: ${LANGFLOW_REFRESH_TOKEN_EXPIRE_SECONDS:-604800}
      # 워크플로우 자동 생성기: 로컬 LLM 기본, OpenAI는 allow 플래그와 API key가 있을 때만 사용.
      LANGFLOW_COMPOSER_LOCAL_BASE_URL: ${LANGFLOW_COMPOSER_LOCAL_BASE_URL:-}
      LANGFLOW_COMPOSER_LOCAL_MODEL: ${LANGFLOW_COMPOSER_LOCAL_MODEL:-}
      LANGFLOW_COMPOSER_ALLOW_OPENAI: ${LANGFLOW_COMPOSER_ALLOW_OPENAI:-false}
      LANGFLOW_COMPOSER_OPENAI_MODEL: ${LANGFLOW_COMPOSER_OPENAI_MODEL:-gpt-4.1-mini}
      LANGFLOW_COMPOSER_ALLOWED_HOSTS: ${LANGFLOW_COMPOSER_ALLOWED_HOSTS:-}
      # OPENAI_API_KEY는 docker compose config 출력에 평문 노출될 수 있어 여기서 전달하지 않는다.
      # LLM API key가 필요하면 커밋하지 않는 docker-compose.override.yml에서만 주입한다.
    volumes:
      # ./components 아래 smb_finder/ 카테고리의 컴포넌트가 캔버스에 나타난다.
      - ./components:/app/custom_components:ro
      - ./flow_builder:/app/flow_builder:ro
      - ./.langflow-data:/app/langflow_data
    extra_hosts:
      # 컨테이너에서 호스트의 smb-finder(8010)에 닿게 한다(Linux/Win/Mac 공통).
      - "host.docker.internal:host-gateway"
