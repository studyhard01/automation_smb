# Langflow(노코드 외피)를 띄우고, 우리 커스텀 컴포넌트를 마운트한다.
# smb-finder 서비스는 호스트에서 따로 실행하고(예: uvicorn ... --port 8010),
# 컴포넌트의 'smb-finder 주소'를 http://host.docker.internal:8010 으로 둔다.
#
# 보안(CLAUDE.md): 환자/검사 데이터가 외부로 나가지 않도록 Langflow도 사내망에서만 띄운다.
# 외부 LLM 노드를 쓰지 말고, 폴더 검색은 이 컴포넌트(→ 사내 smb-finder)만 사용한다.

services:
  langflow:
    image: langflowai/langflow:latest
    ports:
      - "${LANGFLOW_PORT:-7860}:7860"
    environment:
      # 우리 커스텀 컴포넌트를 카테고리 폴더 단위로 로드한다.
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      # 흐름/세션을 파일 DB에 영속화(사내 디스크). 외부 DB 불필요.
      LANGFLOW_DATABASE_URL: sqlite:////app/langflow_data/langflow.db
      LANGFLOW_CONFIG_DIR: /app/langflow_data
    volumes:
      # ./components 아래 smb_finder/ 카테고리의 컴포넌트가 캔버스에 나타난다.
      - ./components:/app/custom_components:ro
      - langflow_data:/app/langflow_data
    extra_hosts:
      # 컨테이너에서 호스트의 smb-finder(8010)에 닿게 한다(Linux/Win/Mac 공통).
      - "host.docker.internal:host-gateway"

volumes:
  langflow_data:
