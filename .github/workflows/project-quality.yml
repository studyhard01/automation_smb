name: Project quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync locked development environment
        run: uv sync --frozen --python 3.11 --extra dev
      - name: Run repository quality rubric
        run: uv run --no-sync python scripts/evaluate_quality.py
