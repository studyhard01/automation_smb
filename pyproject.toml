[project]
name = "smb-finder"
version = "0.1.0"
description = "공유 폴더 찾기 서비스 — 텍스트(이후 음성) 명령으로 온프레미스 SMB 폴더를 즉시 탐색"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "smbprotocol>=1.12",      # import 이름: smbclient
    "httpx>=0.27",            # LLM(OpenAI 호환) 호출용
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]
# 내용 검색의 PDF 본문 추출(선택). 미설치 시 PDF는 unsupported로 건너뛰고 서비스는 계속 동작.
# txt/csv/json/xml/html/docx/xlsx 추출은 stdlib만으로 동작하므로 추가 설치가 필요 없다.
pdf = ["pypdf>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smb_finder"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "integration: 실제 SMB/LLM 서버가 필요한 테스트",
]
