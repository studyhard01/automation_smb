[project]
name = "smb-finder"
version = "0.1.0"
description = "공유 폴더 찾기 서비스 — 텍스트(이후 음성) 명령으로 온프레미스 SMB 폴더를 즉시 탐색"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "smbprotocol>=1.12",      # import 이름: smbclient
    "httpx>=0.27",            # LLM(OpenAI 호환) 호출용
    "psycopg[binary]>=3.2,<4", # 로컬 PostgreSQL/pgvector 검색
    "mcp>=1.28.1,<2",         # 공식 MCP Python SDK v1 (v2 안정화 전 상한 고정)
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]
evaluation = [
    "mlflow[genai]>=3.9,<4",
    # MLflow direct-provider judge adapter는 LiteLLM을 선택 의존성으로 요구한다.
    # 1.92.0은 Windows에서 Rust source build를 요구하므로 검증된 wheel 버전을 고정한다.
    "litellm==1.79.1",
]
studio = [
    "langgraph>=0.2.50",
    "langgraph-cli[inmem]>=0.1.55",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
]
# 내용 검색의 PDF 본문 추출(선택). 미설치 시 PDF는 unsupported로 건너뛰고 서비스는 계속 동작.
# txt/csv/json/xml/html/docx/xlsx 추출은 stdlib만으로 동작하므로 추가 설치가 필요 없다.
pdf = ["pypdf>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smb_finder"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "integration: 실제 SMB/LLM 서버가 필요한 테스트",
]
