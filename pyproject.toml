[project]
name = "automation-smb"
version = "0.2.0"
description = "LLMOps 저장소 기반 공유 문서 검색·대화 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "neo4j>=5.26,<7",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/smb_finder"]

[tool.ruff]
line-length = 120
src = ["backend/src", "backend/tests"]

[tool.pytest.ini_options]
pythonpath = ["backend/src", "."]
markers = [
    "integration: 실제 DB·MinIO·Neo4j·Ollama 연결이 필요한 테스트",
]
