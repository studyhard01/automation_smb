<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>automation_smb Playground</title>
    <link rel="stylesheet" href="/playground/assets/playground.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="tool-panel">
        <div class="panel-header">
          <div>
            <h1>Tool Playground</h1>
            <p>챗봇이 사용할 tool을 고릅니다.</p>
          </div>
          <button id="reloadTools" class="icon-button" title="tool 새로고침">↻</button>
        </div>
        <div id="toolList" class="tool-list" aria-live="polite"></div>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <nav class="tabs" aria-label="Playground modes">
            <button class="tab active" data-tab="chat">Chat</button>
            <button class="tab" data-tab="toolLab">Tool Lab</button>
          </nav>
          <div class="model-row">
            <label>
              Provider
              <select id="provider">
                <option value="local">local</option>
              </select>
            </label>
            <label>
              Base URL
              <input id="baseUrl" type="url" placeholder="http://127.0.0.1:11434/v1" autocomplete="off" />
            </label>
            <label>
              Model
              <input id="model" type="text" placeholder="qwen2.5-coder:7b" autocomplete="off" list="modelOptions" />
              <datalist id="modelOptions"></datalist>
            </label>
            <button id="checkLlm" class="secondary-button" type="button">연결 확인</button>
          </div>
          <div id="llmStatus" class="status-line" aria-live="polite">local LLM 미확인</div>
        </header>

        <div id="chatView" class="view active">
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="chatForm" class="composer">
            <textarea id="messageInput" rows="2" placeholder="예: BRCA 결과 폴더 찾아줘"></textarea>
            <button type="submit">전송</button>
          </form>
        </div>

        <div id="toolLabView" class="view">
          <div class="lab-layout">
            <section>
              <h2>Tool Lab</h2>
              <p>만들고 싶은 tool을 설명하면 manifest 초안을 생성합니다. 아직 자동 등록되지는 않습니다.</p>
              <form id="toolLabForm" class="lab-form">
                <textarea id="toolInstruction" rows="6" placeholder="예: 특정 CSV 파일을 읽어 검사명 후보를 정리하는 tool"></textarea>
                <button type="submit">초안 생성</button>
              </form>
            </section>
            <pre id="toolDraft" class="draft-output">{}</pre>
          </div>
        </div>
      </section>
    </main>
    <script src="/playground/assets/playground.js"></script>
  </body>
</html>
